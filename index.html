<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>الامتحان الشامل – اللغة العربية (الصف الثالث الثانوي)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@400;600;700&display=swap">
<style>
:root{--bg:#f3f7f7;--sf:#fff;--ink:#14232b;--mu:#566870;--ln:#d2dcdf;--ac:#1b3a5c;--on:#fff;--sel:#e1ebf5;--ok:#17703d;--okb:#e2f4e9;--bd:#b3261e;--bdb:#fbe8e6;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1a1f;--sf:#162830;--ink:#e8eff1;--mu:#9db0b7;--ln:#2c434c;--ac:#7fb2e5;--on:#0a1b2b;--sel:#1d3a57;--ok:#6fd49b;--okb:#15321f;--bd:#ff9a90;--bdb:#3a1d1a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1a1f;--sf:#162830;--ink:#e8eff1;--mu:#9db0b7;--ln:#2c434c;--ac:#7fb2e5;--on:#0a1b2b;--sel:#1d3a57;--ok:#6fd49b;--okb:#15321f;--bd:#ff9a90;--bdb:#3a1d1a;color-scheme:dark}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 90px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Naskh Arabic","Amiri","Traditional Arabic",Tahoma,Arial,sans-serif;font-size:19px;line-height:2}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--sf);z-index:10}
[hidden]{display:none!important}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--sf);border-bottom:1px solid var(--ln);padding:8px 16px 0}
.hi{max-width:780px;margin:0 auto;display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
h1{font-size:20px;margin:0;font-weight:700}
#cnt{font-size:16px;color:var(--mu)}
.pb{height:4px;background:var(--ln);margin:6px -16px 0}
#bar{height:100%;width:0;background:var(--ac);transition:width .25s}
main{max-width:780px;margin:0 auto;padding:16px}
.info{background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:8px 16px;margin-bottom:6px;color:var(--mu);font-size:17px}
h2.sec{font-size:20px;margin:26px 0 12px;padding:6px 14px;background:var(--ac);color:var(--on);border-radius:8px}
.ps{background:var(--sf);border:1px solid var(--ln);border-inline-start:5px solid var(--ac);border-radius:8px;padding:8px 14px;margin-bottom:14px}
.ln{display:flex;justify-content:space-between;gap:6px 24px;flex-wrap:wrap}
.q{background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:14px 16px;margin-bottom:14px}
.qh{display:flex;gap:12px;align-items:flex-start}
.qh p{margin:0;font-weight:600}
.n{flex:none;min-width:34px;height:34px;margin-top:6px;border-radius:17px;background:var(--ac);color:var(--on);display:grid;place-items:center;font-size:17px;font-weight:700;line-height:1;padding:0 6px}
.pt{color:var(--bd);font-size:15px;font-weight:600;margin-inline-start:6px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:8px;margin-top:10px}
.opt{display:flex;gap:10px;align-items:center;padding:6px 12px;border:1.5px solid var(--ln);border-radius:8px;cursor:pointer;line-height:1.7}
.opt input{width:18px;height:18px;accent-color:var(--ac);flex:none;margin:0}
.opt .l{font-weight:700;color:var(--ac);flex:none}
.opt.on{border-color:var(--ac);background:var(--sel)}
.opt:focus-within{outline:2px solid var(--ac);outline-offset:2px}
.act{text-align:center;margin:24px 0 40px}
button{font:inherit;font-weight:700;font-size:20px;padding:8px 34px;border:0;border-radius:10px;background:var(--ac);color:var(--on);cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
#hint{margin:8px 0 0;font-size:16px;color:var(--mu)}
.sum{text-align:center;background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:22px 16px;margin-bottom:8px}
.big{font-size:56px;font-weight:700;line-height:1.3;color:var(--ac)}
.sum p{margin:4px 0}
.sub{display:flex;justify-content:center;gap:6px 22px;flex-wrap:wrap;color:var(--mu);font-size:17px}
.r.good{border-inline-start:6px solid var(--ok)}
.r.bad{border-inline-start:6px solid var(--bd)}
.st{font-size:16px;font-weight:700;margin:6px 0 0}
.good .st{color:var(--ok)}.bad .st{color:var(--bd)}
.opt.right{border-color:var(--ok);background:var(--okb)}
.opt.wrong{border-color:var(--bd);background:var(--bdb)}
.opt .tag{margin-inline-start:auto;font-size:15px;font-weight:700}
.right .tag{color:var(--ok)}.wrong .tag{color:var(--bd)}
.ex{margin:10px 0 0;padding:8px 12px;background:var(--bg);border-radius:8px;font-size:17px;line-height:1.9}
@media (max-width:520px){body{font-size:18px}.big{font-size:46px}}
</style>
</head>
<body>
<header><div class="hi"><h1>الامتحان الشامل – اللغة العربية (الصف الثالث الثانوي)</h1><span id="cnt"></span></div><div class="pb"><div id="bar"></div></div></header>
<main>
<div id="exam"><div class="info">نظام اختيارات – الدرجة الكلية حسب درجات الأسئلة المكتوبة أمام كل سؤال.</div><div id="qs"></div>
<div class="act"><button id="sub" type="button" disabled>تسليم الإجابات</button><p id="hint"></p></div></div>
<div id="res" hidden></div>
</main>
<script>
const L=["أ","ب","ج","د"];
const P=(t,l)=>`<div class="ps"><strong>${t}</strong>`+l.map(x=>`<div class="ln"><span>${x[0]}</span><span>${x[1]}</span></div>`).join("")+`</div>`;
const SEC={
0:["أولاً: النحو (الوحدة الأولى – 10 أسئلة – 15 درجة)",""],
10:["ثانياً: الأدب (مدرسة الأحياء والبعث وجيل التطوير – 4 أسئلة – 6 درجات)",""],
14:["ثالثاً: البلاغة (ما سبق دراسته – قطعة و4 أسئلة – 6 درجات)",P("قال الشاعر في حب الوطن:",[["1- وَطَنِي لَوْ شُغِلْتُ بِالْخُلْدِ عَنْهُ","نَازَعَتْنِي إِلَيْهِ فِي الْخُلْدِ نَفْسِي"],["2- وَشَهِدَ اللَّهُ لَمْ يَبْتَعِدْ عَنْ جَفُونِي","شَخْصُهُ سَاعَةً وَلَمْ يَخْلُ حِسِّي"],["3- فَيَا وَطَنِي جَزَاكَ اللَّهُ خَيْراً","وَجَنَّبَكَ المَكَارِهَ وَالأَسَى"]])],
18:["رابعاً: النصوص المتحررة (الأحياء والبعث – 4 أسئلة – 6 درجات)",P("قال الشاعر أرسلان في تحية مصر والرئيس:",[["1- يَا مِصْرُ حَيَّاكِ الإِلَهُ وَسَلَّمَا","وَبَنَى لِمَجْدِكِ فِي المَعَالِي أَنْجُمَا"],["2- أَنْتِ العَرُوسُ وَفِي كِفَاحِكِ زِينَةٌ","تَزْهُو بِهَا الدُّنْيَا وَتَلْقَى المَغْنَمَا"],["3- فَاسْتَقْبِلِي عَهْدَ الشَّبَابِ بِرِفْعَةٍ","وَابْنِي الخُلُودَ لِكُلِّ مَنْ قَدْ أَعْظَمَا"]])],
22:["خامساً: القراءة المتحررة (قطعة وأربعة أسئلة – 7 درجات)",`<div class="ps"><strong>اقرأ القطعة التالية ثم أجب:</strong><div>«إنَّ القراءةَ الواعيةَ ليست مجردَ ترفٍ فكريٍّ أو قضاءِ وقتٍ في العطلات، بل هي عمليةٌ تفاعليةٌ يستحضرُ فيها القارئُ خبراته السابقة لبناء معانٍ جديدة. فالقراءةُ تمنحُ الإنسانَ قدرةً على التفكير النظديّ، وتعميقِ الفهمِ للبشر والمجتمعات. وإنَّ الأمةَ التي تُهملُ القراءةَ تجدُ نفسها في معزلٍ عن الركب الحضاري العالمي، حيثُ يتسارعُ إنتاج المعرفة ويتضاعَفُ يومياً. لذا، فإنَّ الاستثمارَ في تنميةِ مهارات القراءة لدى النشءِ هو الأساسُ الأول لبناء مجتمع المعرفة والابتكار.»</div></div>`]
};
const B=[0,10,14,18,22,26],SN=["النحو","الأدب","البلاغة","النصوص المتحررة","القراءة المتحررة"];
const Q=[
{w:1,q:"«اسْتَفْتِ قَلْبَكَ وَإِنْ أَفْتَاكَ النَّاسُ». حدّد الصياغة الصحيحة عند التعبير عن الجملة السابقة باستخدام مصدر الفعل المخطوط (استفتِ):",o:["إِسْتِفْتَاءُ قَلْبِكَ خَيْرٌ لَكَ","اِسْتِفْتَاءُ قَلْبِكَ خَيْرٌ لَكَ","اِسْتِفْتَاءَ قَلْبِكَ خَيْرٌ لَكَ","أَسْتِفْتَاءُ قَلْبِكَ خَيْرٌ لَكَ"],a:1,e:"مصدر الفعل السداسي «اسْتَفْتَى» همزته همزة وصل (اِسْتِفْتَاء)، ويُرفع لأنه مبتدأ."},
{w:2,q:"صغ صيغة الجمع الصحيحة للكلمة التي تحتها خط: «إنَّ <u>امْرَأً</u> يَسْعَى فِي الْخَيْرِ مَأْجُورٌ».",o:["إِنَّ امْرُؤُونَ يَسْعُونَ فِي الْخَيْرِ مَأْجُورِينَ","إِنَّ أَمْرَاءَ يَسْعَوْنَ فِي الْخَيْرِ مَأْجُورُونَ","إِنَّ رِجَالاً يَسْعَوْنَ فِي الْخَيْرِ مَأْجُورُونَ","إِنَّ مَرِيئِينَ يَسْعَوْنَ فِي الْخَيْرِ مَأْجُورُونَ"],a:2,e:"جمع «امرؤ» من غير لفظه هو «رجال»."},
{w:1,q:"«تَعَالَوْا نَبْنِي هَذَا الْوَطَنَ ، فَوَاللَّهِ لَنَعْلُوَنَّ بِهِ». ميّز الواو في الكلمتين (تَعَالَوْا - نَعْلُو) على الترتيب:",o:["واو أصيلة - واو الجماعة","علامة إعراب - واو الجمع","واو فارقة - واو الجماعة","واو الجماعة - واو أصيلة (لام الفعل)"],a:3,e:"«تعالوا»: واو الجماعة. «نعلو»: الواو أصلية لأنها لام الفعل (علا يعلو)."},
{w:2,q:"اخترْ الصياغة النحوية الصحيحة للجملة: «إنَّ عُلَمَاؤُنَا أُمَنَاؤُنَا فِي هَدْيِ الأُمَّةِ».",o:["إِنَّ عُلَمَائِنَا أُمَنَائِنَا فِي هَدْيِ الأُمَّةِ","إِنَّ عُلَمَاءَنَا أُمَنَاؤُنَا فِي هَدْيِ الأُمَّةِ","إِنَّ عُلَمَاؤُنَا أُمَنَاءَنَا فِي هَدْيِ الأُمَّةِ","إِنَّ عُلَمَاءَنَا أُمَنَائِنَا فِي هَدْيِ الأُمَّةِ"],a:1,e:"اسم «إنَّ» منصوب (عُلَمَاءَنَا)، وخبرها مرفوع (أُمَنَاؤُنَا)."},
{w:2,q:"«أَحَبَّ العَرَبُ أَبْنَاءَهُمْ ، وَوَقَفُوا بِجَانِبِهِمْ فِي الأَزَمَاتِ». مَيِّزِ الصِّيغَةَ الصَّحِيحَةَ عِنْدَ بِنَاءِ الْفِعْلِ لِلْمَجْهُولِ:",o:["أُحِبَّ أَبْنَاءَنَا","أُحِبَّ أَبْنَاءَنَا","أُحِبَّ أَبْنَاؤُنَا","أُحِبَّ أَبْنَائِنَا"],a:2,e:"نائب الفاعل يكون مرفوعاً، فالصحيح: أُحِبَّ أَبْنَاؤُنَا."},
{w:1,q:"«الطَّالِبَاتُ يَرْجُونَ الْخَيْرَ ، وَالطُّلَّابُ يَرْجُونَ الْخَيْرَ». مَيِّزْ وزن الفعل (يَرْجُونَ) فِي الجُمْلَتَيْنِ:",o:["يَفْعُونَ - يَفْعُلْنَ","يَفْعُلْنَ - يَفْعُونَ","يَفْعَلْنَ - يَفْعُلُونَ","يَفْعُلْنَ - يَفْعُلُونَ"],a:1,e:"مع نون النسوة الوزن «يَفْعُلْنَ» (الواو لام الفعل). ومع واو الجماعة تُحذف لام الفعل فيصير الوزن «يَفْعُونَ»."},
{w:1,q:"«حَضَرَ عَمْرُو وَمُحَمَّدٌ ، وَرَأَيْتُ ...... وَمُحَمَّداً». الكلمة الصحيحة لإكمال الفراغ هي:",o:["عَمْرُو","عَمْرٍو","عُمَر","عَمْراً"],a:3,e:"الفراغ مفعول به منصوب، فيكون «عَمْراً» (وواو «عمرو» زائدة تُحذف)."},
{w:2,q:"بَيِّنْ السبب في رسم الهمزة المتوسطة على النبرة في كلمة «يَئِسَ»:",o:["لأن الهمزة مكسورة وما قبلها مفتوح","لأن الهمزة مفتوحة وما قبلها مكسور","لأن الهمزة ساكنة وما قبلها مكسور","لأن الهمزة مضمومة وما قبلها ساكن"],a:0,e:"الهمزة في «يَئِسَ» مكسورة وما قبلها مفتوح، والكسرة أقوى فتُرسم الهمزة على نبرة."},
{w:1,q:"«الْمُؤْمِنُونَ يَعْفُونَ عَنِ الْمُسِيئِينَ». شَكِّلْ حَرْفَ النُّونِ ونَوْعَ الْوَاوِ فِي (يَعْفُونَ):",o:["نون النسوة - واو أصيلة","علامة بناء - واو الجمع","علامة إعراب - واو الجماعة","حرف أصلي - واو الفارقة"],a:2,e:"الفعل مرفوع بثبوت النون، فالنون علامة إعراب، والواو واو الجماعة (فاعل)."},
{w:1,q:"حدد الكلمة التي تبدأ بـ (أل) القمرية ممّا يلي:",o:["الثَّوَابُ","الصَّدَقَةُ","الضَّمِيرُ","الْقَاضِي"],a:3,e:"القاف حرف قمري، أما الثاء والصاد والضاد فحروف شمسية."},
{w:1,q:"قال أحمد شوقي: «يَا شِعْرُ لَمْ تَبْقَ لِلأَهْوَاءِ فِي كَبِدِي شَظِيَّةٌ ، وَلا لِلأَوْهَامِ فِي بَالِي». استنتج العامل الذي أثّر في شعر شوقي والجيل الجديد كما يظهر في البيت:",o:["الانشغال بقضايا العصر السياسية فقط","التغيير والتجديد والبعد عن الأغراض القديمة","التمسك التام بالوقوف على الأطلال","الاقتصار على المحاكاة الشكليّة دون مضمون"],a:1,e:"البيت يعبّر عن التحرر من الأهواء والأوهام القديمة، فهو يدل على التغيير والتجديد."},
{w:2,q:"كيف وائم تلاميذ البارودي بين الأخذ من التراث والالتفات إلى ثقافات العصر؟",o:["بالتخلي التام عن الأوزان والقوافي القديمة واستخدام الشعر الحر","باقتصارهم على ترجمة الآداب الغربية دون التطرق للتراث العربي","استمداد الشكل والأفكار من القديم والحديث معاً والتعبير عن الذات وقضايا العصر","بالتركيز فقط على الأغراض التقليدية كالرثاء والمديح بنفس أسلوب الجاهليين"],a:2,e:"جمعوا بين أصالة القديم وروح العصر، وعبّروا عن ذواتهم وقضايا عصرهم."},
{w:1,q:"قال حافظ إبراهيم: «إِنِّي أَرَى فُقَرَاءَ الكُونِ قَدْ صَبَرُوا عَلى الشَّدَائِدِ حَتَّى قِيلَ : أَبْطَالُ». استنتج السمة التي تحققت في هذا البيت من سمات جيل التطوير:",o:["التطلع للآفاق والتعبير عن المنجزات العصرية الحديثة","غلبة الجانب الفكري والذهني على وجدانهم","استخدام اللغة الحية اليومية وتوظيف الأسطورة","الانشغال بمشكلات المجتمع والاهتمام بالجانب الإنساني والاجتماعي"],a:3,e:"البيت يتناول حال الفقراء وصبرهم، فهو اهتمام بالجانب الإنساني والاجتماعي."},
{w:2,q:"ما الذي خطاه تلاميذ البارودي بالشعر وفاقوا به أستاذهم؟",o:["اهتموا بالناحية البيانية وأفسحوا المجال للمزيد من التجارب الذاتية وتنويع الأغراض","ألغوا استخدام الوزن والقافية تماماً واعتماد السطر الشعري","اهتموا بالجانب الفلسفي على حساب الوجدان والشكل","اعتمدوا كلياً على الرمز والأسطورة واللغات الأجنبية"],a:0,e:"تفوقوا على أستاذهم بالعناية بالبيان وبتجارب الذات وتنويع الأغراض."},
{w:2,q:"استخرج من البيت الأول محسناً بديعياً بين كلمتي (عَنْهُ - إِلَيْهِ) وميّز نوعه وسره الجمالي:",o:["تصريع يعطي جرسًا موسيقياً","طباق إيجاب يوضح المعنى ويقويه بالتضاد","جناس ناقص يطرب الأذن","مراعاة نظير تثير الذهن"],a:1,e:"«عنه» و«إليه» لفظان متضادان في المعنى (إبعاد وقرب)، فهذا طباق إيجاب."},
{w:1,q:"نوع الصورة البيانية في قول الشاعر «جَفُونِي» في البيت الثاني وسر جمالها:",o:["استعارة تصريحية تشبه العين بالجفون","تشبيه بليغ للعين بالجفن","مجاز مرسل عن العين علاقته الجزئية","كناية عن الصفة وهي شدة النوم"],a:2,e:"«الجفون» جزء أُطلق وأُريد به الكل (العين)، فهو مجاز مرسل علاقته الجزئية."},
{w:1,q:"بَيِّنْ الأسلوب والغرض البلاغي منه في قول الشاعر: «فَيَا وَطَنِي جَزَاكَ اللَّهُ خَيْراً»:",o:["أسلوب إنشائي طلبي غرضه التمني والنداء","أسلوب خبري محض غرضه التقرير والوصف","أسلوب إنشائي غير طلبي غرضه التعجب","أسلوب خبري لفظاً إنشائي معنى غرضه الدعاء"],a:3,e:"«جزاك الله خيراً» جملة خبرية في لفظها، ومعناها الدعاء، فهي خبري لفظاً إنشائي معنى."},
{w:2,q:"حدد وسيلة القصر في قول الشاعر «نَازَعَتْنِي إِلَيْهِ فِي الْخُلْدِ نَفْسِي»:",o:["تقديم الجار والمجرور (إليه / في الخلد) على الفاعل (نفسي)","استخدام أداة القصر إنما","العطف بـ (بل) أو (لا)","تعريف الطرفين المبتدأ والخبر"],a:0,e:"قُدِّم الجار والمجرور على الفاعل «نفسي» فأفاد القصر."},
{w:1,q:"ما المغزى الضمني الذي يعبر عنه الشاعر في البيت الأول؟",o:["التعبير عن الحزن والخوف على مستقبل الوطن","الدعوة للهروب من الواقع إلى العالم الخيالي","الفخر بالإنجازات الفردية للشاعر شخصياً","الدعاء لمصر بالسلامة والرفعة والاعتزاز بمكانتها"],a:3,e:"البيت دعاء لمصر بالسلامة والمجد، ويدل على اعتزاز الشاعر بمكانتها."},
{w:2,q:"نوع الصورة البيانية في قول الشاعر «أَنْتِ العَرُوسُ» في البيت الثاني:",o:["استعارة مكنية سر جمالها التشخيص","تشبيه بليغ سر جماله التوضيح ويوحي بالجمال والمكانة","مجاز مرسل عن مصر علاقاته الكلية","كناية عن الموصوف وهو النيل"],a:1,e:"شبّه مصر بالعروس وحُذفت أداة التشبيه ووجه الشبه، فهو تشبيه بليغ."},
{w:2,q:"استنتج من الأبيات سمة شكلية لمدرسة الأحياء والبعث:",o:["الاعتماد على التفعيلة المزدوجة والمقطوعات","التخلي عن القافية كلياً واستخدام الكلمات العامية","التمسك بالوزن والقافية الواحدة واللغة الفصيحة التراثية","وحدة العضوية التامة والبعد عن التجريد"],a:2,e:"الأبيات ملتزمة بالوزن والقافية الموحدة واللغة الفصيحة التراثية."},
{w:1,q:"حدد نوع الأسلوب الغالب في البيت الثالث وغرضه البلاغي:",o:["أسلوب إنشائي (أمر) غرضه الحث والنصح والأمل","أسلوب خبري غرضه التقرير والحقيقة","أسلوب خبري لفظاً إنشائي معنى غرضه التحقير","أسلوب استفهام غرضه التعجب والتنكير"],a:0,e:"«فاستقبلي» و«ابني» فعلا أمر، والغرض الحث والنصح والأمل."},
{w:1,q:"ما الفكرة الرئيسة التي تدور حولها الفقرة؟",o:["طرق قضاء العطلات والأوقات الفارغة","أسباب العزلة الحضارية في المجتمعات القديمة","القراءة الواعية أداة لبناء المعرفة ورقي المجتمعات","كيفية كتابة المقالات النقدية الحديثة"],a:2,e:"تدور الفقرة حول أن القراءة الواعية تبني المعرفة وترتقي بالمجتمعات."},
{w:1,q:"استنتج العلاقة بين جملة «حيثُ يتسارعُ إنتاجُ المعرفة» بما قبلها في السياق:",o:["نتيجة مترتبة عليها","تعليل وبيان للسبب","توضيح وتأكيد للعبارة","استدراك ومناقشة"],a:1,e:"الجملة تعلّل سبب عزلة الأمة التي تهمل القراءة."},
{w:2,q:"أيّ من الإجراءات التالية يُعد الأكثر فاعلية لتشجيع الطلاب على القراءة الواعية؟",o:["إجبار الطلاب على حفظ المعاجم ورص الكلمات","إنشاء أندية القراءة وإدراج حصص مناقشة الكتب في المناهج","إلغاء المكاتب المدرسية والاكتفاء بالكتب الرقمية المختصرة","حظر القراءة الحرّة والاقتصار على المقررات الرسمية"],a:1,e:"أندية القراءة ومناقشة الكتب تشجع على القراءة الواعية والتفاعل مع النص."},
{w:2,q:"ما النتيجة المترتبة على إهمال القراءة لدى الشعوب كما فهمت من الفقرة؟",o:["زيادة الإنتاج الاقتصادي والصناعي للبلاد","الاكتفاء الذاتي من التكنولوجيا الحديثة","الوقوع في معزل عن الركب الحضاري العالمي والتأخر المعرفي","تحسين الروابط الاجتماعية بين الأفراد"],a:2,e:"ذكرت الفقرة أن الأمة التي تهمل القراءة تقع في معزل عن الركب الحضاري العالمي."}
];
const ans=Array(Q.length).fill(null);
const $=id=>document.getElementById(id);
const pt=w=>w===1?"(درجة واحدة)":"(درجتان)";
const sec=i=>SEC[i]?`<h2 class="sec">${SEC[i][0]}</h2>${SEC[i][1]}`:"";
function build(){
  $("qs").innerHTML=Q.map((q,i)=>sec(i)+`<div class="q" role="radiogroup" aria-labelledby="t${i}"><div class="qh"><span class="n">${i+1}</span><p id="t${i}">${q.q}<span class="pt">${pt(q.w)}</span></p></div><div class="opts">`+
    q.o.map((o,j)=>`<label class="opt"><input type="radio" name="q${i}" value="${j}"><span class="l">${L[j]})</span><span>${o}</span></label>`).join("")+`</div></div>`).join("");
}
function upd(){
  const n=ans.filter(a=>a!==null).length,t=Q.length;
  $("cnt").textContent=`أجبت عن ${n} من ${t}`;
  $("bar").style.width=(n/t*100)+"%";
  $("sub").disabled=n<t;
  $("hint").textContent=n<t?`الأسئلة المتبقية: ${t-n}. تظهر النتيجة بعد الإجابة عن كل الأسئلة.`:"أجبت عن كل الأسئلة. يمكنك تعديل أي إجابة قبل التسليم.";
}
$("qs").addEventListener("change",e=>{
  const r=e.target;if(r.type!=="radio")return;
  ans[+r.name.slice(1)]=+r.value;
  r.closest(".opts").querySelectorAll(".opt").forEach(l=>l.classList.toggle("on",l.querySelector("input").checked));
  upd();
});
$("sub").addEventListener("click",()=>{
  if(ans.some(a=>a===null))return;
  const ok=Q.map((q,i)=>ans[i]===q.a);
  const got=i=>ok[i]?Q[i].w:0;
  const tot=Q.reduce((s,q)=>s+q.w,0),s=Q.reduce((x,q,i)=>x+got(i),0),p=Math.round(s/tot*100);
  const parts=SN.map((n,k)=>{let g=0,m=0;for(let i=B[k];i<B[k+1];i++){g+=got(i);m+=Q[i].w}return `<span>${n}: ${g} / ${m}</span>`}).join("");
  const v=p>=90?"ممتاز! أداء رائع.":p>=75?"جيد جداً، استمر على هذا المستوى.":p>=60?"جيد، وبقليل من المراجعة ستتحسن نتيجتك.":"تحتاج إلى مراجعة الدروس ثم إعادة المحاولة.";
  let h=`<div class="sum"><div>النتيجة النهائية</div><div class="big">${s} / ${tot}</div><p>النسبة المئوية: ${p}%</p><p><strong>${v}</strong></p><div class="sub">${parts}</div></div><h2 class="sec">مراجعة الإجابات</h2>`;
  Q.forEach((q,i)=>{
    h+=`<div class="q r ${ok[i]?"good":"bad"}"><div class="qh"><span class="n">${i+1}</span><p>${q.q}</p></div><div class="opts">`+
      q.o.map((o,j)=>{
        const c=j===q.a?"right":(j===ans[i]?"wrong":"");
        const tg=j===q.a?(j===ans[i]?"إجابتك الصحيحة":"الإجابة الصحيحة"):(j===ans[i]?"إجابتك":"");
        return `<div class="opt ${c}"><span class="l">${L[j]})</span><span>${o}</span>${tg?`<span class="tag">${tg}</span>`:""}</div>`;
      }).join("")+`</div><p class="st">${ok[i]?"إجابة صحيحة":"إجابة خاطئة"} – الدرجة: ${got(i)} من ${q.w}</p><p class="ex">${q.e}</p></div>`;
  });
  h+=`<div class="act"><button id="again" type="button">إعادة الامتحان</button></div>`;
  $("res").innerHTML=h;
  $("exam").hidden=true;$("res").hidden=false;
  $("cnt").textContent="تم تسليم الامتحان";$("bar").style.width="100%";
  window.scrollTo(0,0);
  $("again").addEventListener("click",()=>{
    ans.fill(null);build();upd();
    $("res").hidden=true;$("exam").hidden=false;window.scrollTo(0,0);
  });
});
build();upd();
</script>
</body>
</html>
